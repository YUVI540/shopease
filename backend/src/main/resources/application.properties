# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# # App name
# spring.application.name=shopease-backend
# ✅ Railway MySQL Connection
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# ✅ Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ✅ Optional (avoid dialect warning)
# (you can remove dialect line completely)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ✅ Server Port (Render requirement)
server.port=10000